name: Проверки
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Синтаксис Python
        run: python -m compileall -q main.py proxy installer_kit/make_icon.py
      - name: Проверки основной логики
        run: python tests/check_core.py
      - name: Проверки тем и конфликта порта
        run: python tests/check_ui_backend.py
